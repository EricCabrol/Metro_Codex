[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-braking"
version = "0.1.0"
description = "Reproducible exploration of smartphone metro braking recordings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2.4", "pandas>=2,<3", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
metro-braking = "metro_braking.cli:main"

[tool.setuptools.packages.find]
include = ["metro_braking*"]

[tool.setuptools.package-data]
metro_braking = ["routes.json", "report_ui.js", "report_ui.css", "trip_charts.js"]
